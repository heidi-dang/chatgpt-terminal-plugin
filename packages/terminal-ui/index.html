<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Live Terminal</title>
  </head>
  <body>
    <main id="terminal-shell" class="terminal-shell" data-terminal-static-shell data-state="connecting" data-bridge="starting">
      <header class="terminal-header">
        <div class="terminal-identity">
          <div class="terminal-kicker">CHATGPT LIVE TERMINAL</div>
          <div class="terminal-machine-row">
            <span id="terminal-machine" class="terminal-machine">Connecting to computer</span>
            <span id="terminal-status" class="terminal-status" data-state="connecting">
              <span class="state-dot" aria-hidden="true"></span><span>CONNECTING</span>
            </span>
          </div>
          <div id="terminal-path" class="terminal-path">Waiting for terminal session…</div>
        </div>
      </header>

      <section class="terminal-frame" aria-label="Real-time ChatGPT terminal activity over SSE">
        <pre id="terminal-output" class="terminal-output" aria-label="Live terminal output">Terminal UI ready.
Waiting for terminal stream…</pre>
      </section>

      <footer class="terminal-footer">
        <span id="terminal-shell-name">shell</span>
        <span id="terminal-stream-state">SSE CONNECTING</span>
        <span id="terminal-exit" class="terminal-exit" hidden></span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
